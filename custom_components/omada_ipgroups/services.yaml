create_group:
  name: Crear grupo IP
  description: Crea un nuevo grupo de IPs en el controlador Omada.
  fields:
    name:
      name: Nombre
      description: Nombre del grupo.
      required: true
      example: "Dispositivos confiables"
      selector:
        text:
    ips:
      name: IPs
      description: Lista de IPs a incluir. Cada elemento admite ip, mask (opcional, 32 por defecto) y description (opcional).
      required: true
      example: '[{"ip": "192.168.1.50", "description": "Cámara entrada"}]'
      selector:
        object:
    description:
      name: Descripción
      description: Descripción opcional del grupo.
      required: false
      selector:
        text:

update_group:
  name: Actualizar grupo IP
  description: Reemplaza el nombre y la lista completa de IPs de un grupo existente.
  fields:
    group_id:
      name: ID del grupo
      description: Identificador del grupo (atributo group_id del sensor).
      required: true
      selector:
        text:
    name:
      name: Nombre
      description: Nuevo nombre del grupo.
      required: true
      selector:
        text:
    ips:
      name: IPs
      description: Lista completa de IPs que tendrá el grupo tras la actualización.
      required: true
      selector:
        object:
    description:
      name: Descripción
      description: Nueva descripción del grupo. Si no se indica, se conserva la actual.
      required: false
      selector:
        text:

delete_group:
  name: Borrar grupo IP
  description: Elimina un grupo IP del controlador Omada.
  fields:
    group_id:
      name: ID del grupo
      description: Identificador del grupo a borrar.
      required: true
      selector:
        text:

add_ip:
  name: Añadir IP a grupo
  description: Añade una IP a un grupo IP existente sin afectar al resto de entradas.
  fields:
    group_id:
      name: ID del grupo
      description: Identificador del grupo.
      required: true
      selector:
        text:
    ip:
      name: IP
      description: Dirección IP a añadir.
      required: true
      example: "192.168.1.50"
      selector:
        text:
    mask:
      name: Máscara
      description: Máscara de red (por defecto 32, host único).
      required: false
      selector:
        number:
          min: 0
          max: 32
    description:
      name: Descripción
      description: Descripción de esta entrada IP.
      required: false
      selector:
        text:

remove_ip:
  name: Quitar IP de grupo
  description: Elimina una IP de un grupo IP existente.
  fields:
    group_id:
      name: ID del grupo
      description: Identificador del grupo.
      required: true
      selector:
        text:
    ip:
      name: IP
      description: Dirección IP a eliminar.
      required: true
      selector:
        text:

remove_ip_temporarily:
  name: Quitar IP temporalmente
  description: >-
    Quita una IP de un grupo y la guarda (con su máscara y descripción) para
    volver a añadirla después, p. ej. para dar Internet un rato a un
    dispositivo del grupo que lo bloquea. Sobrevive a reinicios de HA.
  fields:
    group_id:
      name: ID del grupo
      description: Identificador del grupo (atributo group_id del sensor).
      required: true
      selector:
        text:
    ip:
      name: IP
      description: Dirección IP a quitar temporalmente.
      required: true
      example: "192.168.1.50"
      selector:
        text:
    minutes:
      name: Minutos
      description: >-
        Pasado este tiempo, la IP vuelve sola al grupo. Sin indicar (o 0), no
        vuelve hasta llamar a «Volver a añadir IPs».
      required: false
      example: 30
      selector:
        number:
          min: 0
          max: 1440
          unit_of_measurement: min

restore_ips:
  name: Volver a añadir IPs
  description: Devuelve a su grupo las IPs quitadas temporalmente.
  fields:
    group_id:
      name: ID del grupo
      description: Identificador del grupo.
      required: true
      selector:
        text:
    ip:
      name: IP
      description: Solo esta IP. Sin indicar, todas las quitadas temporalmente del grupo.
      required: false
      selector:
        text:
